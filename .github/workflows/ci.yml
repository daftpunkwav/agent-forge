name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build shared
        run: npm run build --workspace=@agentforge/shared
      - name: API unit tests
        run: npm test --workspace=@agentforge/api
      - name: Shared unit tests
        run: npm test --workspace=@agentforge/shared --if-present
      - name: Typecheck / build web
        run: npm run build --workspace=@agentforge/web
      - name: Build api
        run: npm run build --workspace=@agentforge/api
