# 可选：本地 PostgreSQL（生产推荐）
# 默认开发仍可用 SQLite（apps/api/.env 中 DATABASE_URL=file:./dev.db）
services:
  postgres:
    image: postgres:16-alpine
    container_name: agentforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: agentforge
      POSTGRES_DB: agentforge
    ports:
      - '5432:5432'
    volumes:
      - agentforge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentforge -d agentforge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentforge_pg_data:
