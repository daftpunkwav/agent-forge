<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentForge — Agent锻造坊</title>

    <!-- 主题变量 -->
    <link rel="stylesheet" href="styles/theme-vars.css">
    <!-- 组件样式 -->
    <link rel="stylesheet" href="styles/components.css">
    <!-- 动画样式 -->
    <link rel="stylesheet" href="styles/animations.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script>
      @theme inline {
        --color-background: var(--vibe-background);
        --color-foreground: var(--vibe-foreground);
        --color-card: var(--vibe-card);
        --color-card-foreground: var(--vibe-card-foreground);
        --color-popover: var(--vibe-popover);
        --color-popover-foreground: var(--vibe-popover-foreground);
        --color-primary: var(--vibe-primary);
        --color-primary-foreground: var(--vibe-primary-foreground);
        --color-secondary: var(--vibe-secondary);
        --color-secondary-foreground: var(--vibe-secondary-foreground);
        --color-muted: var(--vibe-muted);
        --color-muted-foreground: var(--vibe-muted-foreground);
        --color-accent: var(--vibe-accent);
        --color-accent-foreground: var(--vibe-accent-foreground);
        --color-destructive: var(--vibe-destructive);
        --color-destructive-foreground: var(--vibe-destructive-foreground);
        --color-border: var(--vibe-border);
        --color-input: var(--vibe-input);
        --color-ring: var(--vibe-ring);
        --color-chart-1: var(--vibe-chart-1);
        --color-chart-2: var(--vibe-chart-2);
        --color-chart-3: var(--vibe-chart-3);
        --color-chart-4: var(--vibe-chart-4);
        --color-chart-5: var(--vibe-chart-5);
        --color-sidebar: var(--vibe-sidebar);
        --color-sidebar-foreground: var(--vibe-sidebar-foreground);
        --color-sidebar-primary: var(--vibe-sidebar-primary);
        --color-sidebar-primary-foreground: var(--vibe-sidebar-primary-foreground);
        --color-sidebar-accent: var(--vibe-sidebar-accent);
        --color-sidebar-accent-foreground: var(--vibe-sidebar-accent-foreground);
      }
      @layer base {
        body { background: var(--vibe-background); color: var(--vibe-foreground); }
      }
    </script>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">

    <!-- ═══ 顶部导航 ═══ -->
    <header class="sticky top-0 z-50 w-full" style="background: var(--background); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px);">
      <div class="mx-auto flex h-16 items-center justify-between gap-4 px-4 md:px-8" style="max-width: 1280px;">
        <!-- 品牌 -->
        <a href="#/" class="shrink-0 truncate" style="font-family: var(--font-serif); font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; color: var(--foreground); text-decoration: none;">
          AgentForge
        </a>

        <!-- 主导航 -->
        <nav aria-label="主导航" class="hidden md:flex items-center gap-1">
          <a href="#/" data-nav-key="home" class="nav-item px-3 py-2 text-sm font-medium whitespace-nowrap" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">首页</a>
          <a href="#/knowledge" data-nav-key="knowledge" class="nav-item px-3 py-2 text-sm font-medium whitespace-nowrap" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">Agent知识</a>
          <a href="#/llm/basics" data-nav-key="llm" class="nav-item px-3 py-2 text-sm font-medium whitespace-nowrap" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">LLM基础</a>
          <a href="#/news" data-nav-key="news" class="nav-item px-3 py-2 text-sm font-medium whitespace-nowrap" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">前沿资讯</a>
          <a href="#/author" data-nav-key="author" class="nav-item px-3 py-2 text-sm font-medium whitespace-nowrap" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">作者工作台</a>
        </nav>

        <!-- 右侧工具 -->
        <div class="flex items-center gap-2">
          <!-- 主题切换 -->
          <button id="header-theme-toggle" data-theme-toggle
            class="nav-item px-2 py-2"
            style="color: var(--muted-foreground); border-radius: var(--radius); border: none; background: transparent; cursor: pointer;"
            aria-label="切换主题" title="切换深浅主题">
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

          <!-- 移动端菜单按钮 -->
          <button id="mobile-menu-btn" class="md:hidden nav-item px-2 py-2"
            style="color: var(--muted-foreground); border-radius: var(--radius); border: none; background: transparent; cursor: pointer;"
            aria-label="菜单">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <!-- 登录/头像 -->
          <a href="#/login" class="btn btn-primary btn-sm hidden sm:inline-flex" style="text-decoration: none;">登录</a>
        </div>
      </div>

      <!-- 移动端导航 -->
      <div id="mobile-nav" class="md:hidden overflow-hidden" style="max-height: 0; transition: max-height 0.3s ease; border-top: 1px solid var(--border);">
        <nav class="flex flex-col px-4 py-3 gap-1">
          <a href="#/" data-nav-key="home" class="nav-item px-3 py-2 text-sm" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">首页</a>
          <a href="#/knowledge" data-nav-key="knowledge" class="nav-item px-3 py-2 text-sm" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">Agent知识</a>
          <a href="#/llm/basics" data-nav-key="llm" class="nav-item px-3 py-2 text-sm" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">LLM基础</a>
          <a href="#/news" data-nav-key="news" class="nav-item px-3 py-2 text-sm" style="color: var(--muted-foreground); border-radius: var(--radius); text-decoration: none;">前沿资讯</a>
          <a href="#/login" class="btn btn-primary btn-sm mt-2" style="text-decoration: none; text-align: center;">登录</a>
        </nav>
      </div>
    </header>

    <!-- ═══ 页面主体 ═══ -->
    <main id="app-main" style="transition: opacity 0.25s ease, transform 0.25s ease; min-height: 60vh;">
        <!-- SLOT: pageBody — JS动态注入 -->
    </main>

    <!-- ═══ 页脚 ═══ -->
    <footer style="background: var(--muted); border-top: 1px solid var(--border); margin-top: 64px;">
        <div style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 32px; display: grid; gap: 40px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
            <div>
                <h3 style="font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; color: var(--foreground);">AgentForge</h3>
                <p style="margin-top: 8px; font-size: 13px; color: var(--muted-foreground);">Agent锻造坊</p>
                <p style="margin-top: 4px; font-size: 12px; color: var(--muted-foreground);">从零到一掌握Agent开发</p>
            </div>
            <div>
                <h4 style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 12px;">导航</h4>
                <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px;">
                    <li><a href="#/" style="color: var(--foreground); text-decoration: none;">首页</a></li>
                    <li><a href="#/knowledge" style="color: var(--foreground); text-decoration: none;">Agent知识</a></li>
                    <li><a href="#/llm/basics" style="color: var(--foreground); text-decoration: none;">LLM基础</a></li>
                    <li><a href="#/news" style="color: var(--foreground); text-decoration: none;">前沿资讯</a></li>
                </ul>
            </div>
            <div>
                <h4 style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-foreground); margin-bottom: 12px;">知识领域</h4>
                <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px;">
                    <li><a href="#/knowledge/react" style="color: var(--foreground); text-decoration: none;">ReAct模式</a></li>
                    <li><a href="#/knowledge/cot" style="color: var(--foreground); text-decoration: none;">CoT思维链</a></li>
                    <li><a href="#/knowledge/mcp" style="color: var(--foreground); text-decoration: none;">MCP协议</a></li>
                    <li><a href="#/knowledge/frameworks/langchain" style="color: var(--foreground); text-decoration: none;">LangChain</a></li>
                </ul>
            </div>
            <div>
                <p style="font-size: 12px; color: var(--muted-foreground); line-height: 1.6;">
                    一个致力于让Agent知识触手可及的学习平台。<br>
                    精美动画 · 系统化知识 · 前沿资讯
                </p>
            </div>
        </div>
        <div style="border-top: 1px solid var(--border); padding: 16px 24px; text-align: center; font-size: 12px; color: var(--muted-foreground);">
            AgentForge 2026 · 持续迭代中
        </div>
    </footer>

    <!-- 共享脚本 -->
    <script src="scripts/theme-manager.js"></script>
    <script src="scripts/animations/animation-player.js"></script>
    <script src="scripts/toc.js"></script>
    <script src="scripts/animations/animation-controls.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
