<!-- SLOT: pageBody -->
<div style="max-width: 640px; margin: 0 auto; padding: 64px 24px;">

    <div style="text-align: center; margin-bottom: 40px;">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--chart-5), var(--chart-4)); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #1a1714; margin-bottom: 16px;">A</div>
        <h1 style="font-family: var(--font-serif); font-weight: 600; font-size: 28px; margin-bottom: 8px;">申请成为作者</h1>
        <p style="font-size: 14px; color: var(--muted-foreground);">成为AgentForge的作者，分享你的Agent知识</p>
    </div>

    <div style="padding: 32px; border-radius: 20px; background: var(--card); border: 1px solid var(--border);">
        <form id="apply-form" onsubmit="return false;">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--foreground);">你的名字</label>
                <input type="text" id="apply-name" placeholder="你的名字" style="width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--input); color: var(--foreground); font-size: 15px; outline: none; box-sizing: border-box;" required>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--foreground);">邮箱</label>
                <input type="email" id="apply-email" placeholder="you@example.com" style="width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--input); color: var(--foreground); font-size: 15px; outline: none; box-sizing: border-box;" required>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--foreground);">专业领域</label>
                <select id="apply-field" style="width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--input); color: var(--foreground); font-size: 14px; cursor: pointer; box-sizing: border-box;">
                    <option value="">选择你的专业领域</option>
                    <option value="推理模式">推理模式 (ReAct, CoT, ToT, GoT)</option>
                    <option value="框架">Agent框架 (LangChain, AutoGen, CrewAI)</option>
                    <option value="协议">协议标准 (MCP, A2A)</option>
                    <option value="工程">工程实践 (Prompt, Context, Memory)</option>
                    <option value="llm">LLM基础 (Transformer, 微调)</option>
                </select>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--foreground);">自我介绍</label>
                <textarea id="apply-bio" rows="4" placeholder="介绍一下你自己和你的Agent开发经验..." style="width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--input); color: var(--foreground); font-size: 14px; outline: none; resize: vertical; box-sizing: border-box;"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;">
                提交申请
            </button>
        </form>
    </div>

    <div style="margin-top: 32px; padding: 24px; border-radius: 14px; background: var(--muted); border: 1px solid var(--border);">
        <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">作者权益</h3>
        <ul style="margin: 0; padding-left: 20px; font-size: 14px; line-height: 2; color: var(--foreground);">
            <li>在AgentForge发布高质量技术文章</li>
            <li>使用内置动画工具制作交互式可视化</li>
            <li>Markdown编辑器 + 实时预览</li>
            <li>与社区分享知识，建立个人品牌</li>
        </ul>
    </div>

    <div style="margin-top: 24px; text-align: center;">
        <p style="font-size: 14px; color: var(--muted-foreground);">
            已有账号？<a href="#/login" style="color: var(--chart-5); text-decoration: none; font-weight: 500;">登录</a>
        </p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('apply-form');
    if (form && !form.dataset.initialized) {
        form.dataset.initialized = 'true';
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var btn = form.querySelector('button[type="submit"]');
            var originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '提交中...';

            setTimeout(function() {
                btn.disabled = false;
                btn.textContent = originalText;
                alert('申请已提交！我们会在3个工作日内通过邮件通知你结果。');
                window.location.hash = '#/';
            }, 1500);
        });
    }
});
</script>
