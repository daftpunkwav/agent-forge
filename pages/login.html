<!-- SLOT: pageBody -->
<div style="max-width: 480px; margin: 0 auto; padding: 64px 24px;">

    <div style="text-align: center; margin-bottom: 40px;">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--chart-5), var(--chart-4)); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 16px;">Forge</div>
        <h1 style="font-family: var(--font-serif); font-weight: 600; font-size: 28px; margin-bottom: 8px;">登录 AgentForge</h1>
        <p style="font-size: 14px; color: var(--muted-foreground);">登录后可使用Agent对话、学习进度追踪等功能</p>
    </div>

    <div style="padding: 32px; border-radius: 20px; background: var(--card); border: 1px solid var(--border);">
        <form id="login-form" onsubmit="return false;">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--foreground);">邮箱</label>
                <input type="email" id="login-email" placeholder="you@example.com" style="width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--input); color: var(--foreground); font-size: 15px; outline: none; box-sizing: border-box;" required>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--foreground);">密码</label>
                <input type="password" id="login-password" placeholder="输入你的密码" style="width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--input); color: var(--foreground); font-size: 15px; outline: none; box-sizing: border-box;" required>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted-foreground); cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--chart-5);">
                    记住我
                </label>
                <a href="#" style="font-size: 13px; color: var(--chart-5); text-decoration: none;">忘记密码？</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;">
                登录
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; padding-top: 24px; border-top: 1px solid var(--border);">
            <p style="font-size: 14px; color: var(--muted-foreground);">
                还没有账号？<a href="#/register" style="color: var(--chart-5); text-decoration: none; font-weight: 500;">立即注册</a>
            </p>
        </div>
    </div>
</div>
